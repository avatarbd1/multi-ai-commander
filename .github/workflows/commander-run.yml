name: Commander Run

on:
  workflow_dispatch:
    inputs:
      command:
        description: >-
          One high-level instruction for Commander to plan, build, and take
          to HUMAN_GATE (e.g. "Complete T2-01 staff tenant membership and
          take it to HUMAN_GATE.").
        required: true
        type: string
      target:
        description: Optional target repository alias.
        required: false
        type: choice
        default: '(let planner infer)'
        options:
          - '(let planner infer)'
          - Commander
          - Owner
          - ClinicOS

permissions:
  contents: read

jobs:
  commander-run:
    runs-on: ubuntu-latest
    env:
      COMMANDER_PLANNER_COMMAND: node
      COMMANDER_PLANNER_NAME: openai-planner
      COMMANDER_PLANNER_ARGS: '["scripts/providers/openai-planner.mjs"]'
      COMMANDER_BUILDER_COMMAND: node
      COMMANDER_BUILDER_NAME: claude
      COMMANDER_BUILDER_ARGS: '["scripts/providers/claude-builder.mjs"]'
      COMMANDER_REVIEWER_COMMAND: node
      COMMANDER_REVIEWER_NAME: openai-reviewer
      COMMANDER_REVIEWER_ARGS: '["scripts/providers/openai-reviewer.mjs"]'
      COMMANDER_CI_MAX_ATTEMPTS: ${{ vars.COMMANDER_CI_MAX_ATTEMPTS }}
      COMMANDER_CI_INTERVAL_MS: ${{ vars.COMMANDER_CI_INTERVAL_MS }}
      COMMANDER_MAX_REPAIR_CYCLES: ${{ vars.COMMANDER_MAX_REPAIR_CYCLES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code runtime
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Build
        run: npm run build

      - name: Validate required runtime configuration
        env:
          COMMANDER_GH_APP_ID: ${{ secrets.COMMANDER_GH_APP_ID }}
          COMMANDER_GH_INSTALLATION_ID: ${{ secrets.COMMANDER_GH_INSTALLATION_ID }}
          COMMANDER_GH_PRIVATE_KEY: ${{ secrets.COMMANDER_GH_PRIVATE_KEY }}
          COMMANDER_GH_VERIFY_REPOSITORY: ${{ vars.COMMANDER_GH_VERIFY_REPOSITORY }}
          COMMANDER_PLANNER_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMANDER_BUILDER_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMMANDER_REVIEWER_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -eu
          test -n "$COMMANDER_PLANNER_OPENAI_API_KEY" || { echo "Missing repository secret: OPENAI_API_KEY" >&2; exit 1; }
          test -n "$COMMANDER_BUILDER_ANTHROPIC_API_KEY" || { echo "Missing repository secret: ANTHROPIC_API_KEY" >&2; exit 1; }
          node dist/auth/setup.js
          node scripts/validate-runtime-config.mjs
          claude --version >/dev/null

      - name: Convert command to a bounded TaskContract
        id: plan
        env:
          COMMANDER_COMMAND_INPUT: ${{ inputs.command }}
          COMMANDER_TARGET_INPUT: ${{ inputs.target }}
          COMMANDER_GH_APP_ID: ${{ secrets.COMMANDER_GH_APP_ID }}
          COMMANDER_GH_INSTALLATION_ID: ${{ secrets.COMMANDER_GH_INSTALLATION_ID }}
          COMMANDER_GH_PRIVATE_KEY: ${{ secrets.COMMANDER_GH_PRIVATE_KEY }}
          COMMANDER_PLANNER_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMANDER_BUILDER_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMMANDER_REVIEWER_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/commander"
          TASK_PATH="$RUNNER_TEMP/commander/task.json"
          PLAN_RESULT_PATH="$RUNNER_TEMP/commander/plan-result.json"
          echo "task_path=$TASK_PATH" >> "$GITHUB_OUTPUT"
          echo "plan_result_path=$PLAN_RESULT_PATH" >> "$GITHUB_OUTPUT"
          set +e
          if [ "$COMMANDER_TARGET_INPUT" = "(let planner infer)" ] || [ -z "$COMMANDER_TARGET_INPUT" ]; then
            node dist/cli/main.js plan --command "$COMMANDER_COMMAND_INPUT" --out "$TASK_PATH" > "$PLAN_RESULT_PATH"
          else
            node dist/cli/main.js plan --command "$COMMANDER_COMMAND_INPUT" --target "$COMMANDER_TARGET_INPUT" --out "$TASK_PATH" > "$PLAN_RESULT_PATH"
          fi
          PLAN_EXIT_CODE=$?
          set -e
          cat "$PLAN_RESULT_PATH"
          echo "exit_code=$PLAN_EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Summarize planning result
        if: always()
        env:
          PLAN_RESULT_PATH: ${{ steps.plan.outputs.plan_result_path }}
        run: node scripts/write-run-summary.mjs plan "$PLAN_RESULT_PATH" "$GITHUB_STEP_SUMMARY"

      - name: Run managed pipeline to HUMAN_GATE
        id: run
        if: steps.plan.outputs.exit_code == '0'
        env:
          COMMANDER_GH_APP_ID: ${{ secrets.COMMANDER_GH_APP_ID }}
          COMMANDER_GH_INSTALLATION_ID: ${{ secrets.COMMANDER_GH_INSTALLATION_ID }}
          COMMANDER_GH_PRIVATE_KEY: ${{ secrets.COMMANDER_GH_PRIVATE_KEY }}
          COMMANDER_PLANNER_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMANDER_BUILDER_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMMANDER_REVIEWER_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TASK_PATH: ${{ steps.plan.outputs.task_path }}
        run: |
          set +e
          RUN_RESULT_PATH="$RUNNER_TEMP/commander/run-result.json"
          node dist/cli/main.js run --task "$TASK_PATH" > "$RUN_RESULT_PATH"
          RUN_EXIT_CODE=$?
          set -e
          cat "$RUN_RESULT_PATH"
          echo "run_result_path=$RUN_RESULT_PATH" >> "$GITHUB_OUTPUT"
          echo "exit_code=$RUN_EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Summarize managed pipeline result
        if: steps.plan.outputs.exit_code == '0' && always()
        env:
          RUN_RESULT_PATH: ${{ steps.run.outputs.run_result_path }}
        run: node scripts/write-run-summary.mjs run "$RUN_RESULT_PATH" "$GITHUB_STEP_SUMMARY"

      - name: Fail the job on a non-HUMAN_GATE outcome
        if: steps.plan.outputs.exit_code != '0' || steps.run.outputs.exit_code != '0'
        run: |
          echo "Commander did not reach HUMAN_GATE. See the job summary above for the exact blocker." >&2
          exit 1
